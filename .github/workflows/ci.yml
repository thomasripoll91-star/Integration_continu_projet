name: CI Pipeline Financière (Lvl 1 & Lvl 2 S3)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🐳 Démarrage du stockage S3 (Docker Compose)
        run: |
          docker compose up -d
          sleep 3

      - name: 🧪 Tests Niveau 1 (Intégration & Retry BDD)
        run: |
          pytest -v tests/lvl_1/

      - name: ☁️ Exécution Pipeline & Tests Niveau 2 (S3 & Retry S3)
        run: |
          python -m src.lvl_2.pipeline_S3
          pytest -v tests/lvl_2/